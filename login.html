<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · The Biocode Editions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <header class="site-header">
      <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
      <button
        class="menu-btn"
        id="menu-btn"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="nav-panel"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <nav class="nav-panel" id="nav-panel" aria-hidden="true">
      <div class="nav-top">
        <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
        <button class="close-btn" id="close-btn" type="button" aria-label="Close menu">×</button>
      </div>
      <ul class="nav-links">
        <li><a href="co-build.html">Co-Build</a></li>
        <li><a href="longevity.html">Longevity</a></li>
        <li><a href="events.html">What’s On</a></li>
      </ul>
    </nav>

    <main class="login-main">
      <h1>LOG IN TO ACCESS</h1>
      <form class="login-form" action="javascript:void(0)" method="post" novalidate>
        <div class="login-field">
          <label for="email">EMAIL</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="login-field">
          <label for="password">PASSWORD</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <div class="login-options">
          <label class="login-remember">
            <input id="remember" name="remember" type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="login-forgot" href="#">Forgot password?</a>
        </div>
        <button class="login-submit" type="button">LOG IN</button>
      </form>
    </main>

    <script>
      document.querySelector(".login-form").addEventListener("submit", function (event) {
        event.preventDefault();
      });
      document.querySelector(".login-forgot").addEventListener("click", function (event) {
        event.preventDefault();
      });
    </script>
    <script src="main.js"></script>
  </body>
</html>
