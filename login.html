<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · The Biocode Editions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cream font-sans min-h-screen flex flex-col">

  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-medium">The Biocode Editions</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-5 py-16">
    <div class="w-full max-w-md">
      <h1 class="text-4xl font-light text-center mb-2">Welcome Back</h1>
      <p class="text-center text-gray-500 mb-10">Sign in to co-create</p>

      <div class="space-y-6">
        <div>
          <label class="block text-xs tracking-widest text-gray-500 mb-2">EMAIL</label>
          <input type="email" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 focus:outline-none focus:border-gray-400">
        </div>
        <div>
          <label class="block text-xs tracking-widest text-gray-500 mb-2">PASSWORD</label>
          <input type="password" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-4 focus:outline-none focus:border-gray-400">
        </div>
        <div class="flex justify-between text-sm">
          <label class="flex items-center gap-2"><input type="checkbox"> Remember me</label>
          <a href="#" class="text-gray-500">Forgot password?</a>
        </div>
        <button class="w-full bg-ink text-white py-4 rounded-full font-medium">LOG IN</button>
        <p class="text-center text-sm text-gray-500">Not a builder yet? <a href="#" class="text-accent">Join now</a></p>
      </div>
    </div>
  </main>

  <footer class="text-center py-8 text-xs text-gray-400">
    © 2026 · THE BIOCODE EDITIONS
  </footer>
</body>
</html>
