<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product · The Biocode Editions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans">

  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-medium">The Biocode Editions</a>
      <a href="longevity.html" class="text-sm">← Back</a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-5 py-16 text-center">
    <img src="product.jpg" alt="" class="w-48 h-48 object-cover rounded-3xl mx-auto mb-8">
    <h1 id="name" class="text-4xl font-light mb-2">Product</h1>
    <p id="brand" class="text-gray-500 mb-8">Brand</p>
    <p class="text-lg leading-relaxed text-gray-700 max-w-md mx-auto mb-10">
      Precision nutrition designed to support cellular health, recovery, and long-term vitality. Share this page with your prospects.
    </p>
    <button onclick="share()" class="bg-ink text-white px-8 py-3 rounded-full text-sm">Share with Prospect</button>
  </main>

  <footer class="bg-ink text-white py-12 text-center text-xs tracking-widest text-gray-400">
    © 2026 · THE BIOCODE EDITIONS
  </footer>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('name').textContent = params.get('name') || 'Product';
    document.getElementById('brand').textContent = params.get('brand') || '';

    function share() {
      const text = `${document.getElementById('name').textContent} — ${document.getElementById('brand').textContent}\n${location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'The Biocode Editions', text, url: location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('Link copied. Paste it to your prospect.');
      }
    }
  </script>
</body>
</html>
