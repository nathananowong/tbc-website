<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · The Biocode Editions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-panel">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <nav class="nav-panel" id="nav-panel" aria-hidden="true" inert>
      <div class="nav-top">
        <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
        <button class="close-btn" id="close-btn" type="button" aria-label="Close menu">×</button>
      </div>
      <ul class="nav-links">
        <li><a href="events.html">what’s on</a></li>
        <li><a id="nav-longevity" href="longevity.html">longevity</a></li>
        <li><a id="nav-cocreate" href="co-create.html">co-create</a></li>
      </ul>
    </nav>

    <main class="login-main">
      <h1>welcome back</h1>
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="email">email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="password">password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="login-options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>remember me</span>
          </label>
          <button class="forgot" id="forgot-password" type="button">forgot password?</button>
        </div>
        <button class="pill" type="submit">log in</button>
        <p id="message" class="login-message" role="status"></p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
  </body>
</html>
