<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 14px; background: #111; color: white; border: none; border-radius: 8px; margin-top: 10px; }
    #result { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; font-size: 14px; }
    .error { color: #c00; }
    .success { color: #060; }
  </style>
</head>
<body>
  <h2>Supabase Login Test</h2>
  <input id="email" type="email" placeholder="Email" value="nus.nathanwong@gmail.com">
  <input id="password" type="password" placeholder="Password" value="123456">
  <button onclick="testLogin()">Test Login</button>
  <div id="result">Ready. Click the button to test.</div>

  <script>
    // REPLACE THESE TWO LINES
    const SUPABASE_URL = 'https://udviizqhxyhozdgtqhgn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fUJTUxhXmTv4I_Z5ZAYYoQ_s2Jsk4cS';

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function testLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const result = document.getElementById('result');
      result.textContent = 'Testing...';
      result.className = '';

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          result.textContent = 'ERROR:\n' + error.message + '\n\nFull error:\n' + JSON.stringify(error, null, 2);
          result.className = 'error';
        } else {
          result.textContent = 'SUCCESS!\n\nUser ID: ' + data.user.id + '\nEmail: ' + data.user.email;
          result.className = 'success';
        }
      } catch (err) {
        result.textContent = 'EXCEPTION:\n' + err.message + '\n\n' + err.stack;
        result.className = 'error';
      }
    }
  </script>
</body>
</html>
