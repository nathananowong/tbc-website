<!DOCTYPE html>
<html lang="en">
<head>

    })();
  </script>
  <title>Product · The Biocode Editions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["DM Sans", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="utility-page bg-white font-sans">

  <header class="site-header">
    <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
    <button
      class="menu-btn"
      id="menu-btn"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="nav-panel"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav class="nav-panel" id="nav-panel" aria-hidden="true" inert>
    <div class="nav-top">
      <a class="logo" href="index.html"><img src="images/logo-horizontal.png" alt="The Biocode Editions"></a>
      <button class="close-btn" id="close-btn" type="button" aria-label="Close menu">×</button>
    </div>
    <ul class="nav-links">
      <li><a href="events.html">what’s on</a></li>
      <li><a id="nav-longevity" href="longevity.html">longevity</a></li>
      <li><a id="nav-cocreate" href="co-create.html">co-create</a></li>
    </ul>
  </nav>

  <main class="max-w-xl mx-auto px-5 py-16 text-center">
    <img src="product.jpg" alt="" class="w-48 h-48 object-cover rounded-3xl mx-auto mb-8">
    <h1 id="name" class="text-4xl font-light mb-2">Product</h1>
    <p id="brand" class="text-gray-500 mb-8">Brand</p>
    <p class="text-lg leading-relaxed text-gray-700 max-w-md mx-auto mb-10">
      Precision nutrition designed to support cellular health, recovery, and long-term vitality. Share this page with your prospects.
    </p>
    <button onclick="share()" class="bg-ink text-white px-8 py-3 rounded-full text-sm">Share with Prospect</button>
  </main>

  <footer class="bg-ink text-white py-12 text-center text-xs tracking-widest text-gray-400">
    © 2026 · THE BIOCODE EDITIONS
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="main.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('name').textContent = params.get('name') || 'Product';
    document.getElementById('brand').textContent = params.get('brand') || '';

    function share() {
      const text = `${document.getElementById('name').textContent} — ${document.getElementById('brand').textContent}\n${location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'The Biocode Editions', text, url: location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('Link copied. Paste it to your prospect.');
      }
    }
  </script>
</body>
</html>
